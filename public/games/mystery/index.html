/* Choices: lines of questioning, and enamel station signs */
.choices { display: grid; gap: 12px; margin-top: 2rem; }

.asks { display: grid; border-bottom: 1px solid var(--rule); }
.ask { all: unset; box-sizing: border-box; display: block; position: relative; padding: .8rem .5rem .8rem 1.9rem; border-top: 1px solid var(--rule); cursor: pointer; font: italic 400 1.15rem/1.4 var(--prose); transition: color .15s, background .15s; }

.sign { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .15rem 1rem; padding: .85rem 1.1rem .9rem; border: 1px solid var(--rule); border-radius: 4px; background: var(--smoke); box-shadow: inset 0 0 0 3px var(--smoke), inset 0 0 0 4px var(--keyline); cursor: pointer; transition: border-color .15s, background .15s; }

      `The lunch counter glows like a jukebox in the dark. Milo Crane sits at the far end: a small, careful man in a gray suit, the kind who carries an umbrella under a clear sky. He is dry as a tax return.`,
      `The umbrella hangs from the counter beside him — black silk, silver handle, engraved M.C. It drips, slow and steady, into a puddle on the tile.`,

    ],
    asks: [
      ['Ask where he’s been', [

        `Dot shrugs. “He was here when I went in back at ten past eleven — storeroom roof leaks like a sieve when it rains, I was mopping till half past. He was here when I came out.”`,

      ['Ask about Julian’s trip', [

      ]],

  eddie: { sign: 'Baggage room', sub: 'Eddie Rourke, the porter. Found the body.', where: 'The baggage room', title: 'Eddie Rourke', rain: .5,
    text: [

    ],
    asks: [
      ['Ask about the blood', [
        `“I found him, that’s all!” The words trip over each other. “I went out at half past to set the step boxes for the 12:10. Saw a fella sitting out in the rain at the far end, figured a drunk, went to roust him. Then I seen the pin.”`,
        `He stares at his cuff. “I checked for a pulse. There wasn’t one.”`,
        '#blood',
      ]],
      ['Ask about his hand', [
        `“Mr. Marsh’s boys.” He lifts the splint. “I owed him six hundred from the card game in back of the Lantern. Last Tuesday they broke two fingers so I’d remember. I can’t hold a fork.”`,
        `He jerks his chin at a clipboard on the wall. “And I was right here signing for mail sacks all night. Look for yourself.”`,
        `You do. Eddie’s crooked signature, three times: 11:12. 11:20. 11:27. The baggage room is at the far end of the station from Platform 4.`,
        '#debt', '#maillog',
      ]],
    ] },
  sal: { sign: 'Newsstand', sub: 'Sal. Twenty years behind that counter.', where: 'The newsstand', title: 'Sal', rain: .6,
    text: [
      `Sal’s newsstand is a lit box in the middle of the concourse: papers weighted with bricks, a radio murmuring a ballgame from the coast. Twenty years behind that counter. Nothing moves through Meridian Station without passing Sal.`,
    ],
    asks: [
      ['Ask about Julian Marsh', [
        `“Mr. Marsh? Bought the late edition at ten past eleven, same as every Friday. Tipped me a quarter.” Sal shakes his head. “Had his umbrella up before he was out from under the roof and went straight down Platform 4. Like a man with an appointment he didn’t want to keep.”`,
        '#appointment',
      ]],
      ['Ask who came and went', [
        `“After the rain started? Nobody went out the front doors — not a soul. Who would?” He counts on his fingers. “Eddie came tearing in off the platforms at half past, white as a sheet, hollering for the stationmaster. Miss Lane, the singer, came in off the street at 11:35, wet as a drowned cat.”`,
        `He nods at the iron pillar beside his stand. “Can’t see the lunch counter from here, if you’re wondering. Never could.”`,
        '#nobodyout', '#veraarrive',
      ]],
    ] },
};
const ENDINGS = {
  milo: { stamp: 'Case closed', title: 'The Dry Man', rain: .22, text: [
    `You lift the umbrella off the counter. Water runs down your wrist and into your sleeve.`,
    `“Funny thing, Milo. You got here at half past ten. The rain didn’t start till eleven. And you never left that stool.”`,
    `He smiles like a man looking at a bad hand. “I stepped out for a cigarette.”`,
    `You tap the ashtray at his elbow, three butts deep. “In this rain? With an ashtray right here? You walked out to the end of Platform 4 while Dot was mopping the storeroom. Julian was waiting for you.”`,
    `Doyle thumbs open the briefcase. Inside is the Blue Lantern ledger, one page with its corner torn away — the corner Julian Marsh was holding when he died.`,
    `“Voss would have killed me,” Milo says quietly. “You don’t know what he does to bookkeepers.”`,
    `“No,” you say, and close the cuffs. “But I know what the State does to murderers.”`,
    `The 12:10 pulls out on time. Vera Lane isn’t on it. She’s standing at the end of Platform 4 in the thinning rain, and for the first time tonight, she’s crying.`,
  ] },
  vera: { stamp: 'Case unsolved', title: 'The Wrong Woman', rain: 1, text: [
    `The cuffs close around Vera Lane’s wrists with a sound like a door shutting. Her hatpin, her motive, her soaking fur. The papers love it.`,
    `By Monday a cabbie swears he dropped her at Meridian at 11:33, and Sal swears she came through the doors at 11:35 — five minutes after the porter found the body. The DA drops the charge by Wednesday. Vera leaves town on the first train out and never looks back.`,
    `Across town, in a warm office above the Blue Lantern, a small, careful man feeds a ledger into the stove, one page at a time.`,
  ] },
  eddie: { stamp: 'Case unsolved', title: 'The Wrong Man', rain: 1, text: [
    `Eddie Rourke goes quietly, the way men go when life has already taken everything worth fighting for. Blood on his cuff, a grudge in his pocket, and he found the body. It writes itself.`,
    `It unwrites itself just as fast. The baggage log has his crooked signature at 11:12, 11:20 and 11:27 — the far end of the station, while Julian Marsh was dying on Platform 4. And the police surgeon says a man with two broken fingers couldn’t close his hand around a hatpin, let alone drive one through a winter coat.`,
    `They let Eddie go on Friday. The railroad lets him go on Saturday. Across town, a small, careful man feeds a ledger into the stove, one page at a time.`,
  ] },
};
const TRUTH = `Milo Crane had been skimming the Blue Lantern for years. When Julian found out and booked the 12:10 to take the ledger to Mr. Voss, Milo lifted Vera’s hatpin from her dressing room, reached the station at half past ten — before the rain — and asked Julian to hear him out at the end of Platform 4. At ten past eleven, with Dot in the storeroom, he walked out under his umbrella. He came back without a drop on him. Only the umbrella was wet.`;
// [facts needed ('a|b' = either), clue]
const KEYS = [
  [['rain', 'miloalibi', 'umbrella'], `Milo got there before the rain and swore he never left his stool — but his umbrella was dripping.`],
  [['dotgap'], `Dot was in the storeroom from 11:10 to 11:30. Nobody saw Milo during the murder.`],
  [['exposed'], `The murder spot was open to the sky. Nobody came back from it dry without an umbrella.`],
  [['ledger', 'books'], `Julian died clutching a page of the club’s ledger. Milo kept the books.`],
  [['pinmissing'], `Vera’s hatpin vanished while Milo was in and out of her dressing room.`],
  [['cab|veraarrive'], `Vera reached the station at 11:35, after the porter found the body.`],
  [['maillog'], `Eddie was signing the baggage log at the far end of the station.`],
];
const RAIN = { title: .75, intro: .85, hub: .6, accuse: .9 };

// ponytail: load-time story lint instead of a test suite; a typo'd fact id fails loudly in the console.
{
  const marks = [INTRO, ...Object.values(PLACES).flatMap(p => [p.text, ...p.asks.map(a => a[1])])].flat().filter(l => l[0] === '#').map(l => l.slice(1));
  KEYS.flatMap(k => k[0].flatMap(s => s.split('|'))).concat(marks).forEach(id => console.assert(FACTS[id], `Unknown fact: ${id}`));
  Object.keys(FACTS).forEach(id => console.assert(marks.includes(id), `Fact never found: ${id}`));
}

const $ = s => document.querySelector(s);
const stage = $('#stage'), dialog = $('#notes'), notesBtn = $('#notes-btn');
const blank = () => ({ screen: 'title', place: null, end: null, visits: [], asked: [], facts: [] });
let S = blank(), anim = null, seen = 0;

const now = () => T0 + 5 * S.visits.length;
function clock(m, short) {
  const h = Math.floor(m / 60) % 24, mm = String(m % 60).padStart(2, '0'), h12 = h % 12 || 12;
  if (short) return `${h12}:${mm}`;
  return h === 0 && mm === '00' ? 'Midnight' : `${h12}:${mm} ${h < 12 ? 'A.M.' : 'P.M.'}`;
}
const noted = id => `<p class="noted"><b>Noted</b>${FACTS[id][1]}</p>`;
const lines = arr => arr.map(l => l[0] === '#' ? noted(l.slice(1)) : `<p>${l}</p>`).join('');
const sign = (act, label, sub, attrs = '') => `<button class="sign" data-act="${act}" ${attrs}><b>${label}</b><span>${sub}</span></button>`;
const gain = arr => arr.forEach(l => { const id = l.slice(1); if (l[0] === '#' && !S.facts.includes(id)) S.facts.push(id); });
const has = spec => spec.split('|').some(id => S.facts.includes(id));

function file() {
  const html = Object.entries(GROUPS).map(([g, name]) => {
    const ids = Object.keys(FACTS).filter(id => FACTS[id][0] === g && S.facts.includes(id));
    return ids.length ? `<h3>${name}</h3><ul>${ids.map(id => `<li>${FACTS[id][1]}</li>`).join('')}</ul>` : '';
  }).join('');
  return html || '<p>Nothing yet. Walk the concourse.</p>';
}

const SCREENS = {
  title: () => `
    <p class="kicker">Meridian Station · Friday, 11:45 P.M.</p>
    <h1 class="title" tabindex="-1"><span>Last</span> <span>Train</span> <span>Out</span></h1>
    <p class="lede">A man is dead at the end of Platform 4. Three people had reason to kill him, and the last train of the night leaves in twenty-five minutes.</p>
    <div class="cast"><small>Featuring</small>${Object.values(SUSPECTS).map(([n, r]) => `<div><b>${n}</b><i>${r}</i></div>`).join('')}</div>
    <p class="meta">About five minutes · Five leads, time for four · One accusation</p>
    <div class="choices">${sign('start', 'Take the case', 'Step in out of the rain.')}</div>`,

  intro: () => `
    <p class="kicker">Meridian Station · 11:45 P.M.</p>
    <h1 tabindex="-1">The Rain Started at Eleven</h1>
    ${lines(INTRO)}
    <div class="choices">${sign('hub', 'Walk the concourse', 'Five leads. Time for four.')}</div>`,

  hub: () => {
    const v = S.visits.length, left = MAX - v;
    return `
    <p class="kicker">The concourse · ${clock(now())}</p>
    <h1 tabindex="-1">The Concourse</h1>
    <p>${HUB[v]}</p>
    <p class="leads">${left === 1 ? 'Time for one more lead. Make it count.' : `Time for ${WORDS[left]} more leads.`}</p>
    <div class="choices">
      ${Object.entries(PLACES).map(([id, p]) => {
        const at = S.visits.indexOf(id), t = clock(T0 + 5 * (at + 1));
        return at < 0 ? sign('visit', p.sign, p.sub, `data-id="${id}"`) : sign('visit', p.sign, `Visited at ${t === 'Midnight' ? 'midnight.' : t}`, 'disabled');
      }).join('')}
      ${sign('accuse', 'Name the killer', 'Doyle’s waiting with the cuffs.', 'data-tone="red"')}
    </div>`;
  },

  place: () => {
    const id = S.place, p = PLACES[id];
    const asked = S.asked.filter(k => k.startsWith(id)).map(k => +k.slice(id.length));
    const open = p.asks.map((_, i) => i).filter(i => !asked.includes(i));
    const last = S.visits.length >= MAX;
    return `
    <p class="kicker">${p.where} · ${clock(now())}</p>
    <h1 tabindex="-1">${p.title}</h1>
    <div class="block">${lines(p.text)}</div>
    ${asked.map((i, n) => `<div class="block${anim === 'ask' && n === asked.length - 1 ? ' reveal new' : ''}" tabindex="-1"><p class="asked">${p.asks[i][0]}</p>${lines(p.asks[i][1])}</div>`).join('')}
    <div class="choices${anim === 'ask' ? ' reveal' : ''}">
      ${open.length ? `<div class="asks">${open.map(i => `<button class="ask" data-act="ask" data-i="${i}">${p.asks[i][0]}</button>`).join('')}</div>` : ''}
      ${last ? sign('hub', 'Last call', 'The 12:10 is boarding.', 'data-tone="red"') : sign('hub', 'Back to the concourse', `${DEPART - now()} minutes until the 12:10.`)}
    </div>`;
  },

  accuse: () => {
    const last = S.visits.length >= MAX;
    return `
    <p class="kicker">The concourse · ${clock(now())}</p>
    <h1 tabindex="-1">Name the Killer</h1>
    ${last
      ? `<p>12:05. A conductor’s voice rolls down the concourse: “Twelve-ten for Chicago — all aboard!”</p>
         <p>That’s all the time there is. Doyle falls in beside you, turning the cuffs over in his hands. “Well, Detective? Who killed Julian Marsh?”</p>`
      : `<p>Doyle falls in beside you, turning the cuffs over in his hands. “Clock’s still running, Detective. But if you’ve got it — who killed Julian Marsh?”</p>`}
    <h2>Your case notes</h2>
    <div class="file inline">${file()}</div>
    <div class="cards">${Object.entries(SUSPECTS).map(([id, [n, , r]]) => `<button class="card" data-act="name" data-id="${id}" aria-label="Accuse ${n}"><b>${n}</b><span>${r}</span><em>Accuse</em></button>`).join('')}</div>
    ${last ? '' : `<div class="choices">${sign('hub', 'Not yet', 'Back to the concourse.')}</div>`}`;
  },

  end: () => {
    const e = ENDINGS[S.end];
    return `
    <p class="kicker">Meridian Station · 12:10 A.M.</p>
    <div class="stamp">${e.stamp}</div>
    <h1 tabindex="-1">${e.title}</h1>
    ${lines(e.text)}
    <section class="truth">
      ${S.end === 'milo' ? '' : `<h2>What really happened</h2><p>${TRUTH}</p>`}
      <h2>The clues that cracked it</h2>
      <ul class="clues">${KEYS.map(([need, t]) => {
        const got = need.every(has);
        return `<li class="${got ? 'got' : 'miss'}"><span class="sr">${got ? 'Found: ' : 'Missed: '}</span>${t}</li>`;
      }).join('')}</ul>
      <p class="meta">You found ${S.facts.length} of ${Object.keys(FACTS).length} clues and followed ${S.visits.length} of 5 leads.</p>
    </section>
    <div class="choices">${sign('start', 'Take the case again', 'Same night. Same rain. Different leads.')}</div>`;
  },
};

function drawBoard() {
  const s = S.screen, left = DEPART - now();
  const status = s === 'title' ? 'ON TIME' : s === 'end' ? 'DEPARTED' : left <= 5 ? 'BOARDING' : `${left} MIN`;
  const fields = { now: s === 'end' ? '12:10' : clock(now(), true), dep: '12:10', to: 'CHICAGO', plat: '4', status: status.padEnd(8) };
  for (const [k, txt] of Object.entries(fields)) {
    const box = $(`[data-f="${k}"] .tiles`), prev = box.dataset.v;
    if (prev === txt) continue;
    box.dataset.v = txt;
    box.innerHTML = [...txt].map((ch, i) => `<span class="tile${prev && prev[i] !== ch ? ' flip' : ''}" style="--d:${i * 50}ms">${ch.trim()}</span>`).join('');
  }
  $('#board-sr').textContent = `${s === 'end' ? '12:10 A.M.' : clock(now())}. The 12:10 to Chicago, platform 4: ${status.toLowerCase().replace('min', 'minutes')}.`;
}

// ponytail: every click re-renders the whole screen from S; a text game never needs more.
const SEL = '.kicker, h1, h2, p, .stamp, .sign, .ask, .card, .cast, .file, .clues li';
function render() {
  stage.className = `stage${S.screen === 'title' ? ' is-title' : ''}${anim === 'screen' ? ' reveal' : ''}`;
  stage.innerHTML = SCREENS[S.screen]();
  let i = 0;
  (anim === 'screen' ? [stage] : [...stage.querySelectorAll('.reveal')])
    .forEach(r => r.querySelectorAll(SEL).forEach(el => el.style.setProperty('--i', i++)));
  drawBoard();
  $('#count').textContent = S.facts.length;
  notesBtn.hidden = S.screen === 'title';
  if (S.facts.length > seen) { notesBtn.classList.remove('pulse'); void notesBtn.offsetWidth; notesBtn.classList.add('pulse'); }
  seen = S.facts.length;
  rain.to(S.screen === 'place' ? PLACES[S.place].rain : S.screen === 'end' ? ENDINGS[S.end].rain : RAIN[S.screen]);
  if (anim === 'screen') { scrollTo(0, 0); stage.querySelector('h1').focus({ preventScroll: true }); }
  if (anim === 'ask') {
    const b = stage.querySelector('.new');
    b.focus({ preventScroll: true });
    b.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }
}
function go(kind = 'screen') { anim = kind; render(); anim = null; }

const ACT = {
  start() { S = blank(); S.screen = 'intro'; gain(INTRO); go(); },
  hub() { S.screen = S.visits.length >= MAX ? 'accuse' : 'hub'; go(); },
  visit({ id }) { S.visits.push(id); S.place = id; S.screen = 'place'; gain(PLACES[id].text); go(); },
  ask({ i }) { S.asked.push(S.place + i); gain(PLACES[S.place].asks[i][1]); go('ask'); },
  accuse() { S.screen = 'accuse'; go(); },
  name({ id }) { S.end = id; S.screen = 'end'; go(); },
  notes() { $('#file').innerHTML = file(); dialog.showModal(); },
  close() { dialog.close(); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) ACT[b.dataset.act](b.dataset);
});
dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });   // backdrop

// Rain: three parallax layers of streaks, thinned or thickened per scene.
const rain = (() => {
  const c = $('#rain'), g = c.getContext('2d'), calm = matchMedia('(prefers-reduced-motion: reduce)');
  const LAYERS = [ // share, min/max length (px), speed (px/s), alpha, width
    [.55, 9, 14, 520, .10, 1], [.30, 16, 24, 760, .17, 1], [.15, 26, 40, 1050, .26, 1.4]];
  const rnd = (a, b) => a + Math.random() * (b - a);
  let W = 0, H = 0, drops = [], level = .75, target = .75, t0 = 0, running = false;
  function size() {
    const d = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    c.width = W * d; c.height = H * d; g.setTransform(d, 0, 0, d, 0, 0);
    const n = Math.min(450, Math.round(W * H / 4200));
    drops = LAYERS.map(([share, lo, hi, v]) => Array.from({ length: Math.round(n * share) },
      () => ({ x: rnd(0, W * 1.3), y: rnd(-H, H), len: rnd(lo, hi), v: v * rnd(.85, 1.15), k: Math.random() })));
  }
  function frame(t) {
    const dt = Math.min((t - t0) / 1000, .05) || 0; t0 = t;
    level += (target - level) * Math.min(1, dt * 1.2);
    const wind = .17 + .05 * Math.sin(t / 5200);
    g.clearRect(0, 0, W, H);
    drops.forEach((layer, li) => {
      g.beginPath();
      for (const d of layer) {
        d.y += d.v * dt; d.x -= d.v * wind * dt;
        if (d.y - d.len > H || d.x + d.len < 0) { d.y = -d.len - rnd(0, 120); d.x = rnd(0, W + H * wind); }
        if (d.k > level) continue;
        g.moveTo(d.x, d.y); g.lineTo(d.x + d.len * wind, d.y - d.len);
      }
      g.strokeStyle = `rgba(196, 208, 224, ${LAYERS[li][4]})`; g.lineWidth = LAYERS[li][5]; g.stroke();
    });
    if (calm.matches) running = false; else requestAnimationFrame(frame);
  }
  function kick() { if (!running) { running = true; t0 = performance.now(); requestAnimationFrame(frame); } }
  addEventListener('resize', () => { size(); kick(); });
  calm.addEventListener('change', kick);
  size(); kick();
  return { to(v) { target = v; if (calm.matches) level = v; kick(); } };
})();

// Boot, carrying game state across republishes when the viewer supports it.
function boot(data) {
  const own = (o, k) => typeof k === 'string' && Object.hasOwn(o, k);
  const ok = data && own(SCREENS, data.screen) && ['visits', 'asked', 'facts'].every(k => Array.isArray(data[k]))
    && (data.screen !== 'place' || own(PLACES, data.place)) && (data.screen !== 'end' || own(ENDINGS, data.end));
  S = ok ? { ...blank(), ...data } : blank();
  seen = S.facts.length;
  render();
}
document.fonts.load('1em "Special Elite"');   // title screen doesn't use it; fetch before the first case note
window.claude?.hot?.snapshot?.(() => S);
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
